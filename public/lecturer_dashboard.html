<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecturer Dashboard - UPath</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/toast.css?v=2">
    <style>
        .current-class-card {
            background: linear-gradient(135deg, var(--primary) 0%, #B91C1C 100%);
            color: white;
            border-radius: var(--radius-lg);
            padding: 32px;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }
        .current-class-info h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .class-details {
            display: flex;
            gap: 20px;
            margin-top: 12px;
            font-size: 0.9rem;
            opacity: 0.9;
        }
        .start-btn {
            padding: 16px 32px;
            background: white;
            color: var(--primary);
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all var(--transition);
            text-decoration: none;
            white-space: nowrap;
        }
        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .no-class-card {
            background: var(--surface);
            border: 2px dashed var(--border);
            border-radius: var(--radius-lg);
            padding: 48px;
            text-align: center;
            margin-bottom: 28px;
        }
        .no-class-card h3 {
            color: var(--text);
            margin-bottom: 8px;
            font-size: 1.1rem;
        }
        .no-class-card p {
            color: var(--text-muted);
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            text-align: center;
        }
        .stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 4px;
        }
        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .section-link {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--primary);
            text-decoration: none;
        }
        .section-link:hover { text-decoration: underline; }

        .classes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        .class-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            transition: all var(--transition);
        }
        .class-card:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.1);
        }
        .class-header {
            display: flex;
            align-items: start;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .class-code {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary);
            background: var(--primary-light);
            padding: 4px 10px;
            border-radius: 4px;
        }
        .class-name {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }
        .class-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 16px;
        }
        .class-actions {
            display: flex;
            gap: 8px;
        }
        .class-actions .btn {
            flex: 1;
            padding: 10px 16px;
            font-size: 0.85rem;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }
        .quick-action {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            text-decoration: none;
            color: var(--text);
            transition: all var(--transition);
        }
        .quick-action:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }
        .quick-action-icon {
            width: 40px;
            height: 40px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
        }
        .quick-action-text {
            font-weight: 600;
            font-size: 0.9rem;
        }

        @media (max-width: 1024px) {
            .stats-row { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .stats-row { grid-template-columns: 1fr; }
            .current-class-card { flex-direction: column; text-align: center; }
            .classes-grid { grid-template-columns: 1fr; }
        }

        /* Pill Notifications */
        .notif-pills-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 320px;
            pointer-events: none;
        }
        .notif-pill {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
            border-radius: var(--radius);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 12px 16px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            pointer-events: auto;
            position: relative;
            overflow: hidden;
            animation: pillSlideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: translateX(100px);
        }
        .notif-pill.dismissing {
            animation: pillSlideOut 0.4s ease forwards;
        }
        @keyframes pillSlideIn {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes pillSlideOut {
            from { opacity: 1; transform: translateX(0); max-height: 120px; }
            to { opacity: 0; transform: translateX(100px); max-height: 0; padding: 0; margin: 0; border: none; }
        }
        .notif-pill-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .notif-pill-body { flex: 1; min-width: 0; cursor: pointer; }
        .notif-pill-title {
            font-weight: 700;
            font-size: 0.82rem;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .notif-pill-msg {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
        .notif-pill-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px;
            opacity: 0.5;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }
        .notif-pill-close:hover { opacity: 1; }
        .notif-pill-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: currentColor;
            opacity: 0.3;
            animation: pillProgress 10s linear forwards;
        }
        @keyframes pillProgress {
            from { width: 100%; }
            to { width: 0%; }
        }
        @media (max-width: 768px) {
            .notif-pills-container {
                right: 10px; left: 10px; max-width: none; top: 65px;
            }
        }
    </style>
</head>

    <script src="js/api.js"></script>
    <script>
        const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        let lecturerId = '210101';

        function loadUserData() {
            const userStr = sessionStorage.getItem('upath_user');
            if (userStr) {
                const user = JSON.parse(userStr);
                const displayName = user.fullName || 'Lecturer';
                document.getElementById('welcomeTitle').textContent = `Welcome back, ${displayName}`;
                
                if (user.id) lecturerId = user.id;
                
                if (user.fullName) {
                    const initials = user.fullName.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
                    document.getElementById('userAvatar').textContent = initials;
                }
            }
        }

        function updateDate() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('dateDisplay').textContent = now.toLocaleDateString('en-US', options);
        }

        async function loadClasses() {
            const now = new Date();
            const today = dayNames[now.getDay()];
            const currentHour = now.getHours();
            
            // Get timetable
            // FIX: Use dedicated lecturer endpoint
            const myClasses = await API.getClassesByLecturer(lecturerId);
            // const allClasses = await API.fetchTimetable();
            // const myClasses = allClasses.filter(c => c.lecturerId === lecturerId);
            const todayClasses = myClasses.filter(c => c.day === today);
            
            // --- NEW: FETCH STATS FROM SERVER FOR CONSISTENCY ---
            const uniqueCodes = [...new Set(myClasses.map(c => c.code))];
            let totalAvg = 0;
            let totalSessions = 0;
            
            try {
                // Fetch stats for all courses in parallel
                const statsPromises = uniqueCodes.map(code => API.fetchCourseStats(code));
                const results = await Promise.all(statsPromises);
                
                // Calculate weighted global average
                let weightedSum = 0;
                let validCourses = 0;
                
                results.forEach(stat => {
                    if (stat.totalSessions > 0) {
                        weightedSum += stat.avgAttendance; 
                        validCourses++;
                        totalSessions += stat.totalSessions;
                    }
                });
                
                if (validCourses > 0) {
                    totalAvg = Math.round(weightedSum / validCourses);
                }
                
                // Get total students taught by this lecturer
                const studentsRes = await API.get(`/api/users?lecturerId=${lecturerId}`);
                let users = studentsRes.users || [];
                // Count unique IDs just in case of any overlaps
                const uniqueIds = new Set(users.map(u => u.id));
                
                document.getElementById('totalStudentsVal').textContent = uniqueIds.size || 0;
                document.getElementById('avgAttendanceVal').textContent = totalAvg + '%';
                
            } catch (err) {
                console.error("Dashboard stats sync failed:", err);
            }
            // ----------------------------------------------------
            
            // Update class counts
            document.getElementById('totalClasses').textContent = uniqueCodes.length;
            document.getElementById('todayClasses').textContent = todayClasses.length;
            
            // Find current or next class
            const container = document.getElementById('currentClassContainer');
            const currentClass = todayClasses.find(c => {
                const startHour = parseInt(c.time.split(':')[0]);
                return currentHour >= startHour && currentHour < startHour + 2;
            });
            
            const nextClass = todayClasses.find(c => {
                const startHour = parseInt(c.time.split(':')[0]);
                return startHour > currentHour;
            });
            
            if (currentClass) {
                container.innerHTML = `
                    <div class="current-class-card">
                        <div class="current-class-info">
                            <h3>Currently Teaching: ${currentClass.name}</h3>
                            <p>${currentClass.code} • ${currentClass.room}</p>
                            <div class="class-details">
                                <span>${currentClass.time}</span>
                                <span>Year ${currentClass.year} Students</span>
                            </div>
                        </div>
                        <a href="/pages/lecturer/qr_code.html?class=${currentClass.code}" class="start-btn">Generate QR Code</a>
                    </div>
                `;
            } else if (nextClass) {
                const startHour = parseInt(nextClass.time.split(':')[0]);
                const minsUntil = (startHour - currentHour) * 60 - now.getMinutes();
                container.innerHTML = `
                    <div class="current-class-card" style="background: linear-gradient(135deg, #10B981 0%, #059669 100%);">
                        <div class="current-class-info">
                            <h3>Next Class: ${nextClass.name}</h3>
                            <p>${nextClass.code} • ${nextClass.room} • Starting in ~${minsUntil} min</p>
                            <div class="class-details">
                                <span>${nextClass.time}</span>
                                <span>Year ${nextClass.year} Students</span>
                            </div>
                        </div>
                        <a href="/pages/lecturer/qr_code.html?class=${nextClass.code}" class="start-btn">Prepare QR Code</a>
                    </div>
                `;
            } else {
                 // Try to find next upcoming class in future days
                const nextDayName = getNextClassDay(myClasses);
                let upcomingClass = null;
                
                if (nextDayName !== 'your next scheduled day') {
                     const upcomingClasses = myClasses.filter(c => c.day === nextDayName);
                     // Sort by time
                     upcomingClasses.sort((a, b) => parseInt(a.time) - parseInt(b.time));
                     upcomingClass = upcomingClasses[0];
                }

                if (upcomingClass) {
                    container.innerHTML = `
                        <div class="current-class-card" style="background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);">
                            <div class="current-class-info">
                                <h3>Upcoming: ${upcomingClass.name} (${nextDayName})</h3>
                                <p>${upcomingClass.code} • ${upcomingClass.room}</p>
                                <div class="class-details">
                                    <span>${upcomingClass.time}</span>
                                    <span>Year ${upcomingClass.year} Students</span>
                                </div>
                            </div>
                            <a href="/pages/lecturer/qr_code.html?class=${upcomingClass.code}" class="start-btn">Prepare</a>
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div class="no-class-card">
                            <h3>No More Classes Today</h3>
                            <p>Enjoy your free time. Your next class is on ${nextDayName}.</p>
                        </div>
                    `;
                }
            }
            
            // Render unique classes
            const classesGrid = document.getElementById('classesGrid');
            
            let html = '';
            uniqueCodes.forEach(code => {
                const c = myClasses.find(cl => cl.code === code);
                const sessions = myClasses.filter(cl => cl.code === code);
                
                html += `
                    <div class="class-card">
                        <div class="class-header">
                            <span class="class-code">${c.code}</span>
                            <span style="font-size: 0.75rem; color: var(--text-muted);">Year ${c.year}</span>
                        </div>
                        <div class="class-name">${c.name}</div>
                        <div class="class-info">${sessions.length} sessions/week • ${c.room}</div>
                        <div class="class-actions">
                            <a href="/pages/lecturer/qr_code.html?class=${c.code}" class="btn btn-primary">QR Code</a>
                            <a href="/pages/lecturer/manual_attendance.html?class=${c.code}" class="btn btn-secondary">Manual</a>
                        </div>
                    </div>
                `;
            });
            
            classesGrid.innerHTML = html || '<div class="text-muted">No classes assigned</div>';
            
            // Load notifications based on my classes
            loadNotifications(uniqueCodes);
        }

        function getNextClassDay(classes) {
            const dayOrder = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
            const todayIdx = new Date().getDay();
            
            for (let i = 1; i <= 7; i++) {
                const checkDay = dayNames[(todayIdx + i) % 7];
                if (classes.some(c => c.day === checkDay)) {
                    return checkDay;
                }
            }
            return 'your next scheduled day';
        }

        async function loadNotifications(courseCodes) {
            if (!courseCodes || courseCodes.length === 0) return;
            
            try {
                // Fetch announcements for these courses
                const codesParam = courseCodes.join(',');
                const data = await API.get(`/api/announcements/by-courses?codes=${encodeURIComponent(codesParam)}`);
                let announcements = data.announcements || [];
                
                // Filter 48 hours and 'Clear All' timestamp
                const now = new Date();
                const FORTY_EIGHT_HOURS = 48 * 60 * 60 * 1000;
                const clearedTime = parseInt(localStorage.getItem('notifs_cleared_time') || '0');
                const readTime = parseInt(localStorage.getItem('notifs_last_read') || '0');
                
                announcements = announcements.filter(a => {
                    const ts = new Date(a.timestamp || a.createdAt).getTime();
                    return (now.getTime() - ts) < FORTY_EIGHT_HOURS && ts > clearedTime && ts > readTime;
                });

                // Load dismissed pills
                const dismissedStr = sessionStorage.getItem('dismissed_pills') || '[]';
                const dismissedIds = new Set(JSON.parse(dismissedStr));
                const activeNotifCount = announcements.length;

                let pillsContainer = document.getElementById('notifPills');
                if (!pillsContainer) {
                    pillsContainer = document.createElement('div');
                    pillsContainer.id = 'notifPills';
                    pillsContainer.className = 'notif-pills-container';
                    document.body.appendChild(pillsContainer);
                }
                pillsContainer.innerHTML = '';

                let idx = 0;
                announcements.forEach((a) => {
                    const notifId = `pill_ann_${a.id || idx}`;
                    if (dismissedIds.has(notifId)) { return; }

                    let color = '#3B82F6', bg = '#EFF6FF', icon = 'ℹ️';
                    let typeLabel = 'UPDATE';
                    if (a.type === 'cancel') { color = '#EF4444'; bg = '#FEF2F2'; icon = '🚫'; typeLabel = 'CANCELLED'; }
                    else if (a.type === 'delay') { color = '#F59E0B'; bg = '#FFFBEB'; icon = '🕒'; typeLabel = 'DELAYED'; }
                    else if (a.type === 'online') { color = '#059669'; bg = '#ECFDF5'; icon = '💻'; typeLabel = 'ONLINE'; }
                    else if (a.type === 'exam') { color = '#7C3AED'; bg = '#F5F3FF'; icon = '📝'; typeLabel = 'EXAM'; }

                    const title = `${a.courseCode}: ${typeLabel}`;
                    const msg = a.message;

                    const pill = document.createElement('div');
                    pill.className = 'notif-pill';
                    pill.id = notifId;
                    pill.style.borderLeftColor = color;
                    pill.style.animationDelay = `${idx * 0.15}s`;
                    pill.innerHTML = `
                        <div class="notif-pill-icon" style="background:${bg}; color:${color};">${icon}</div>
                        <div class="notif-pill-body" onclick="window.location.href='/pages/lecturer/announcements.html'">
                            <div class="notif-pill-title">${title}</div>
                            <div class="notif-pill-msg">${msg}</div>
                        </div>
                        <button class="notif-pill-close" onclick="event.stopPropagation(); dismissPill('${notifId}')">×</button>
                        <div class="notif-pill-progress" style="color:${color};"></div>
                    `;
                    pillsContainer.appendChild(pill);

                    setTimeout(() => { dismissPill(notifId, true); }, 10000 + (idx * 1500));
                    idx++;
                });

                const badge = document.getElementById('notifBadge');
                if (badge) {
                    if (activeNotifCount > 0) {
                        badge.textContent = activeNotifCount;
                        badge.style.display = 'flex';
                    } else {
                        badge.style.display = 'none';
                    }
                }
            } catch (err) {
                console.error('Failed to load notifications:', err);
            }
        }

        function dismissPill(id, isAuto) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.add('dismissing');
                setTimeout(() => el.remove(), 400);
            }
            try {
                const dismissed = JSON.parse(sessionStorage.getItem('dismissed_pills') || '[]');
                const set = new Set(dismissed);
                set.add(id);
                sessionStorage.setItem('dismissed_pills', JSON.stringify(Array.from(set)));
            } catch (e) {}
        }

        function logout() {
            sessionStorage.removeItem('upath_user');
            window.location.href = '/pages/auth.html';
        }

        /**
         * Update the live clock display every second
         */
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit',
                second: '2-digit',
                hour12: true 
            });
            document.getElementById('liveClock').textContent = timeStr;
        }

        // Initialize on page load
        loadUserData();
        updateDate();
        loadClasses();
        updateClock();
        
        // Update clock every second
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
