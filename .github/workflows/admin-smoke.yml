name: Admin Smoke

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-admin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start server
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid
          sleep 10

      - name: Run admin smoke
        env:
          SMOKE_BASE_URL: http://localhost:3000
          ADMIN_TEST_ID: admin
          LECTURER_TEST_ID: 210153
          LECTURER_TEST_PASSWORD: staff123
        run: npm run smoke:admin

      - name: Print server log on failure
        if: failure()
        run: |
          echo '--- server.log ---'
          cat server.log

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then kill $(cat server.pid) || true; fi
